name: Danger

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  ios-smoke-test:
    # Builds+tests the real Xcode fixture project under ios_smoke_test/ with
    # code coverage enabled, then runs danger-blanket for real (not
    # dry_run) against this PR via the :xccov parser. See ios_smoke_test/Dangerfile.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # macos-15 runners ship several Xcode versions side by side, but the
      # one `xcode-select` defaults to only has the visionOS Simulator
      # runtime pre-installed, not iOS - `xcodebuild test` then finds no iOS
      # Simulator destination at all. Try every installed Xcode first (one
      # of them usually does have it, no network needed); only fall back to
      # an actual download (`-downloadPlatform`, needs a signed-in Apple ID
      # to work reliably on CI) if truly none of them do.
      - name: Select an Xcode with the iOS Simulator runtime
        run: |
          echo "Installed Xcode versions:"
          ls /Applications | grep Xcode

          for dev_dir in /Applications/Xcode*.app/Contents/Developer; do
            sudo xcode-select -s "$dev_dir"
            if xcrun simctl list runtimes 2>/dev/null | grep -q "iOS "; then
              echo "Using $dev_dir (has an iOS runtime)"
              xcrun simctl list runtimes
              exit 0
            fi
          done

          echo "No installed Xcode has an iOS runtime, downloading one..."
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -downloadPlatform iOS

      # The Xcode picked above has an iOS runtime installed, but that
      # doesn't mean it has any simulator *device* provisioned for it (the
      # runner's default device set is tied to whichever Xcode was
      # originally selected) - create one explicitly instead of guessing
      # what already exists, boot it, and target it by UDID (not name -
      # `-showdestinations` is xcodebuild's own authoritative view of what
      # it considers usable, which is what actually matters here).
      - name: Create an iOS Simulator device for testing
        id: sim
        working-directory: ios_smoke_test
        run: |
          echo "xcodebuild destinations before creating a device:"
          xcodebuild -showdestinations -project BlanketiOS.xcodeproj -scheme BlanketiOS || true

          runtime_id=$(xcrun simctl list runtimes available --json | jq -r '[.runtimes[] | select(.identifier | contains("SimRuntime.iOS"))] | max_by(.version) | .identifier')
          echo "Runtime: $runtime_id"

          device_type_id=$(xcrun simctl list devicetypes --json | jq -r '[.devicetypes[] | select(.name == "iPhone 16")] | first | .identifier // empty')
          if [ -z "$device_type_id" ]; then
            device_type_id=$(xcrun simctl list devicetypes --json | jq -r '[.devicetypes[] | select(.name | startswith("iPhone"))] | last | .identifier')
          fi
          echo "Device type: $device_type_id"

          udid=$(xcrun simctl create CI-Test-Device "$device_type_id" "$runtime_id")
          echo "Created simulator: $udid"
          xcrun simctl boot "$udid"
          xcrun simctl list devices available

          echo "xcodebuild destinations after creating a device:"
          xcodebuild -showdestinations -project BlanketiOS.xcodeproj -scheme BlanketiOS || true

          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Run tests with code coverage
        working-directory: ios_smoke_test
        run: |
          xcodebuild test \
            -project BlanketiOS.xcodeproj \
            -scheme BlanketiOS \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult

      - name: Run danger-blanket
        working-directory: ios_smoke_test
        env:
          DANGER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bundle exec danger --dangerfile=Dangerfile

      # Not hosted anywhere yet (see CLAUDE.md), so links in the PR comment
      # fall back to plain GitHub file links - upload as a build artifact so
      # the full line-by-line report can still be downloaded and opened
      # locally from the workflow run.
      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ios_smoke_test/coverage_report/
          if-no-files-found: ignore
