<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>__BLANKET_TITLE__</title>
    <link rel="icon" href="__BLANKET_FAVICON_HREF__" type="__BLANKET_FAVICON_TYPE__">
    <link rel="stylesheet" href="assets/style.css">
    <script>
        // Applied before first paint to avoid a flash of the wrong theme -
        // app.js (loaded later, at the end of body) owns the toggle button
        // itself but doesn't need to re-run this on load.
        (function () {
            try {
                var stored = localStorage.getItem('blanket-coverage-theme');
                if (stored === 'light' || stored === 'dark') {
                    document.documentElement.setAttribute('data-theme', stored);
                }
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <header id="top-bar" class="top-bar">
        <div id="top-bar-brand" class="top-bar-brand" data-i18n-title="back_to_top" title="Back to top">
            <img src="__BLANKET_LOGO_SRC__" class="top-bar-logo" alt="">
            <span class="top-bar-title">__BLANKET_TITLE__</span>
        </div>
        <div id="search-wrapper" class="search-wrapper">
            <input type="search" id="search-input" class="search-input" data-i18n-placeholder="filter_placeholder" placeholder="Filter files…" autocomplete="off">
            <button id="search-clear" class="search-clear" data-i18n-aria-label="clear_search" data-i18n-title="clear_search" aria-label="Clear search" title="Clear search">&times;</button>
        </div>
        <span class="top-bar-stat" id="project-stat">…</span>
        <button id="theme-toggle" class="theme-toggle" data-i18n-title="toggle_theme" data-i18n-aria-label="toggle_theme" title="Toggle light/dark theme" aria-label="Toggle light/dark theme"></button>
    </header>
    <div class="layout">
        <div class="sidebar-column">
            <div class="sidebar-toolbar">
                <label class="sidebar-filter-label">
                    <input type="checkbox" id="needs-attention-filter">
                    <span data-i18n="needs_attention_only">Needs attention only</span>
                </label>
                <label class="sidebar-filter-label" id="changed-only-row">
                    <input type="checkbox" id="changed-only-filter">
                    <span data-i18n="changed_in_pr">Changed in this PR</span>
                </label>
            </div>
            <nav id="sidebar" class="sidebar"></nav>
        </div>
        <main id="content" class="content"></main>
    </div>
    <script src="assets/i18n.js"></script>
    <script src="assets/app.js"></script>
</body>
</html>
